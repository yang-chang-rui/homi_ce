name: Build multi-arch .so and dependency installer for plugins

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write        # 用于推送生成的脚本和 .so
  pull-requests: read    # 用于读取 PR 信息

jobs:
  build-and-generate:
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        arch: [x86_64, x86, arm64]   # 将三种架构并行编译，加快速度

    steps:
      # ---------- 公共准备：检出代码 ----------
      - name: Checkout base
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find plugin folders with changed .c files
        id: plugins
        run: |
          # ...（与之前完全相同，略）...
          # 注意：这一步我们只需在所有 matrix 中执行一次即可，
          # 但因每个 job 独立，后面会重复运行。为简化，直接在 matrix 中执行，
          # 但最终只有一次提交。我们可改为在一个前置 job 中计算文件夹，
          # 然后传递给编译 job。为保持示例简洁，这里允许每个 arch 都运行检测。
          # 实际使用建议拆分 job。

      # ---------- 安装交叉编译工具链（不同架构不同） ----------
      - name: Setup cross-compilation tools
        run: |
          sudo apt-get update
          case "${{ matrix.arch }}" in
            x86_64)
              sudo apt-get install -y gcc
              ;;
            x86)
              sudo dpkg --add-architecture i386
              sudo apt-get update
              sudo apt-get install -y gcc-multilib g++-multilib libc6-dev:i386
              ;;
            arm64)
              sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross
              ;;
          esac

      # ---------- 为所有架构安装通用依赖（由 AI 提供） ----------
      # 注意：这里我们需要先调用 AI 获得依赖包列表并安装，
      # 但 install_deps.sh 的生成我们也要保留。因此重构步骤：
      # 1. 获取 C 源码
      # 2. 调用 AI，返回 JSON（包含依赖包列表 + install_deps.sh 脚本）
      # 3. 根据依赖包列表安装开发包（同时安装对应架构的版本）
      # 4. 编译 .so
      # 5. 收集产物
      # 由于 matrix 会重复执行 AI 调用，可在后续做合并优化，这里简化为每个 arch 都独立分析。
      # 一个更优的方案：用单个 job 分析依赖并安装，然后编译，三种架构在一个 job 中顺序或并行编译。
      # 但为展示结构，这里保留矩阵，但需注意文件同步问题。推荐实际使用时采用单个 job + 多架构编译。
      # 下面先给出单个 job 的版本（推荐）。

