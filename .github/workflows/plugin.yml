name: Build multi-arch .so and deps installer

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout base
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find plugin folders with changed .c files
        id: plugins
        run: |
          set -e
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"

          if git fetch --no-tags --prune origin "pull/${PR_NUMBER}/head:pr_head"; then
            DIFF_RANGE="$BASE_SHA..pr_head"
          else
            git fetch --no-tags --prune origin "${{ github.event.pull_request.head.sha }}" || true
            DIFF_RANGE="$BASE_SHA..${{ github.event.pull_request.head.sha }}"
          fi

          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMR "$DIFF_RANGE" -- 'homi_ce/plugin/*/**.c' || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "folders=[]" >> $GITHUB_OUTPUT
            exit 0
          fi

          FOLDERS=$(echo "$CHANGED_FILES" | xargs -I {} dirname {} | sort -u)
          FOLDERS_JSON=$(echo "$FOLDERS" | jq -R -s -c 'split("\n")[:-1]')
          echo "folders=$FOLDERS_JSON" >> $GITHUB_OUTPUT

      - name: Early exit if no changes
        if: steps.plugins.outputs.folders == '[]'
        run: echo "No plugin .c files changed."

      - name: Install cross-compilation toolchains
        if: steps.plugins.outputs.folders != '[]'
        run: |
          sudo apt-get update
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib libc6-dev:i386
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Process each plugin folder
        if: steps.plugins.outputs.folders != '[]'
        env:
          API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          set -e
          FOLDERS='${{ steps.plugins.outputs.folders }}'
          echo "$FOLDERS" | jq -r '.[]' | while read folder; do
            echo "::group::Processing $folder"

            git checkout pr_head 2>/dev/null || git checkout "${{ github.event.pull_request.head.sha }}"

            PLUGIN_NAME=$(basename "$folder")
            C_FILES=$(find "$folder" -maxdepth 1 -name "*.c" -type f)
            if [ -z "$C_FILES" ]; then
              echo "No .c files in $folder, skipping."
              git checkout -
              continue
            fi

            C_CONTENT=""
            for f in $C_FILES; do
              C_CONTENT+="// File: $f
            $(cat "$f")

            "
            done

            SYSTEM_PROMPT="You are a system engineer. Analyze the following C plugin source code and find all non-standard #include <...> directives (ignore standard headers like stdio.h, stdlib.h, string.h, etc.).
            Then do two things:
            1. List the corresponding Ubuntu 22.04 development package names (ending with -dev) separated by commas on the first line.
            2. Generate a bash script (starting from the second line) that automatically detects the Linux distribution (Ubuntu/Debian, CentOS/RHEL, Alpine, Arch) and uses the native package manager to install those development packages.
            Important:
            - The script must start with #!/bin/bash.
            - Do not use sudo.
            - Output only the requested content, no explanations or markdown formatting.
            - Package names must be accurate, provide alternatives if unsure."

            jq -n \
              --arg model "deepseek-chat" \
              --arg system "$SYSTEM_PROMPT" \
              --arg ccode "$C_CONTENT" \
              '{
                model: $model,
                messages: [
                  {role: "system", content: $system},
                  {role: "user", content: ("C source code:\n" + $ccode)}
                ],
                temperature: 0.1,
                max_tokens: 1500
              }' > request.json

            for i in 1 2; do
              curl -s --max-time 60 -o response_body -w "%{http_code}" \
                https://api.deepseek.com/v1/chat/completions \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer $API_KEY" \
                -d @request.json > http_code.txt
              HTTP_CODE=$(cat http_code.txt)
              if [ "$HTTP_CODE" -eq 200 ]; then break; fi
              if [ $i -eq 2 ]; then
                echo "API failed, skipping $folder"; continue 2
              fi
              sleep 2
            done

            CONTENT=$(jq -r '.choices[0].message.content // ""' response_body)
            if [ -z "$CONTENT" ]; then echo "Empty AI response, skipping."; continue; fi

            DEPS_LINE=$(echo "$CONTENT" | head -n1)
            SCRIPT_BODY=$(echo "$CONTENT" | tail -n +2)

            if echo "$SCRIPT_BODY" | grep -q '```'; then
              SCRIPT_BODY=$(echo "$SCRIPT_BODY" | sed -n '/```bash/,/```/p' | sed '1d;$d')
            fi

            if [[ ! "$SCRIPT_BODY" =~ ^#!/bin/bash ]]; then
              SCRIPT_BODY="#!/bin/bash
            $SCRIPT_BODY"
            fi

            DEPS=$(echo "$DEPS_LINE" | tr ',' ' ')
            if [ -n "$DEPS" ]; then
              echo "Installing dependencies: $DEPS"
              sudo apt-get install -y $DEPS || echo "Some packages might not exist, continuing..."
            fi

            SRC_FILES=$(echo $C_FILES | tr '\n' ' ')

            echo "Compiling $PLUGIN_NAME for x86_64..."
            gcc -shared -fPIC -o "$folder/${PLUGIN_NAME}.so.x86_64" $SRC_FILES -Wall

            echo "Compiling $PLUGIN_NAME for x86 (32-bit)..."
            gcc -m32 -shared -fPIC -o "$folder/${PLUGIN_NAME}.so.x86" $SRC_FILES -Wall

            echo "Compiling $PLUGIN_NAME for arm64..."
            aarch64-linux-gnu-gcc -shared -fPIC -o "$folder/${PLUGIN_NAME}.so.arm64" $SRC_FILES -Wall

            echo "$SCRIPT_BODY" > "$folder/install_deps.sh"
            chmod +x "$folder/install_deps.sh"

            git checkout -
            git checkout pr_head 2>/dev/null || git checkout "${{ github.event.pull_request.head.sha }}"
            git add "$folder/${PLUGIN_NAME}.so.x86_64" "$folder/${PLUGIN_NAME}.so.x86" "$folder/${PLUGIN_NAME}.so.arm64" "$folder/install_deps.sh"
            git commit -m "Add multi-arch .so and deps installer for $PLUGIN_NAME" || echo "Nothing to commit for $folder"
            git checkout -
            echo "::endgroup::"
          done

      - name: Push generated files to PR branch
        if: steps.plugins.outputs.folders != '[]'
        run: |
          git checkout pr_head 2>/dev/null || git checkout "${{ github.event.pull_request.head.sha }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
