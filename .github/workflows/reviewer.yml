name: DeepSeek Merge Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  ai-review:
    runs-on: ubuntu-latest
    permissions:
      statuses: write
      pull-requests: write
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff (robust for forks)
        id: diff
        run: |
          set -e
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"

          git fetch --no-tags --prune origin "$BASE_SHA" || true

          if git fetch --no-tags --prune origin "pull/${PR_NUMBER}/head:pr_head"; then
            DIFF_RANGE="$BASE_SHA..pr_head"
          else
            git fetch --no-tags --prune origin "$HEAD_SHA" || true
            if git rev-parse --verify --quiet "$HEAD_SHA" >/dev/null; then
              DIFF_RANGE="$BASE_SHA..$HEAD_SHA"
            else
              echo "Error: Cannot fetch PR head" && exit 1
            fi
          fi

          git diff "$DIFF_RANGE" > pr.diff
          head -n 5000 pr.diff > pr_trimmed.diff
          echo "content<<EOF" >> $GITHUB_OUTPUT
          cat pr_trimmed.diff >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Ask DeepSeek
        id: ai
        env:
          API_KEY: ${{ secrets.llm_api_key }}
        run: |
          set -e

          TITLE="${{ github.event.pull_request.title }}"
          BODY="${{ github.event.pull_request.body }}"
          DIFF_FILE="pr_trimmed.diff"

          # 如果 diff 过大，裁剪至前 2000 行（可调整）
          DIFF_SIZE=$(wc -c < "$DIFF_FILE")
          echo "Diff 原始大小: $DIFF_SIZE 字节"
          if [ "$DIFF_SIZE" -gt 30000 ]; then
            echo "Diff 过大，裁剪为前 1500 行"
            head -n 1500 "$DIFF_FILE" > pr_trimmed_small.diff
            DIFF_FILE="pr_trimmed_small.diff"
          fi

          # 使用正确的模型名称（根据您实际可用模型调整）
          MODEL="deepseek-chat"   # 或 "deepseek-v4-flash"
          jq -n \
            --arg model "$MODEL" \
            --arg system "你是一个代码审查专家。根据 PR 的 diff 判断是否允许合并，重点检查：逻辑错误、安全漏洞、破坏性变更。只返回 JSON：{\"allowed\": true/false, \"reason\": \"原因\"}" \
            --arg title "$TITLE" \
            --arg body "$BODY" \
            --rawfile diff "$DIFF_FILE" \
            '{
              model: $model,
              messages: [
                {role: "system", content: $system},
                {role: "user", content: ("PR 标题：" + $title + "\nPR 描述：" + $body + "\n\nDiff:\n" + $diff)}
              ],
              temperature: 0.1,
              max_tokens: 256
            }' > request.json

          echo "请求体大小: $(wc -c < request.json) 字节"

          curl -s --max-time 60 -o response_body -w "%{http_code}" \
            https://api.deepseek.com/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $API_KEY" \
            -d @request.json \
            > http_code.txt

          HTTP_CODE=$(cat http_code.txt)
          echo "HTTP状态码: $HTTP_CODE"

          # 打印完整响应体（调试）
          echo "========== 响应体内容 =========="
          cat response_body
          echo ""
          echo "================================="

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "API调用失败，HTTP状态码: $HTTP_CODE"
            echo "allowed=false" >> $GITHUB_OUTPUT
            echo "reason=DeepSeek API 调用失败 (HTTP $HTTP_CODE)" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 检查错误字段
          ERROR_MSG=$(jq -r '.error.message // ""' response_body)
          if [ -n "$ERROR_MSG" ]; then
            echo "API 返回错误: $ERROR_MSG"
            echo "allowed=false" >> $GITHUB_OUTPUT
            echo "reason=DeepSeek API 错误: $ERROR_MSG" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 提取 content 和 finish_reason
          CONTENT=$(jq -r '.choices[0].message.content // ""' response_body)
          FINISH_REASON=$(jq -r '.choices[0].finish_reason // ""' response_body)
          echo "finish_reason: $FINISH_REASON"

          # 根据 finish_reason 处理
          if [ "$FINISH_REASON" = "content_filter" ]; then
            echo "内容被安全策略拦截"
            echo "allowed=false" >> $GITHUB_OUTPUT
            echo "reason=AI审查未通过：内容被安全策略拦截" >> $GITHUB_OUTPUT
            exit 0
          elif [ "$FINISH_REASON" = "length" ]; then
            echo "输出因长度限制被截断"
            echo "allowed=false" >> $GITHUB_OUTPUT
            echo "reason=AI审查无法完成：代码变更量过大，建议人工复审" >> $GITHUB_OUTPUT
            exit 0
          elif [ -z "$CONTENT" ] && [ "$FINISH_REASON" = "stop" ]; then
            # 正常结束但无内容，视为通过
            echo "AI审查完成，未发现问题"
            echo "allowed=true" >> $GITHUB_OUTPUT
            echo "reason=AI审查通过" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 有内容，解析 JSON
          ALLOWED=$(echo "$CONTENT" | jq -r '.allowed // false')
          REASON=$(echo "$CONTENT" | jq -r '.reason // "未知原因"')

          echo "allowed=$ALLOWED" >> $GITHUB_OUTPUT
          echo "reason=$REASON" >> $GITHUB_OUTPUT
          echo "AI 结论: allowed=$ALLOWED, reason=$REASON"

      - name: Set merge check status
        id: set_status
        uses: actions/github-script@v7
        # ✅ 修正：只传递 script，不传递自定义参数
        with:
          script: |
            const allowed = '${{ steps.ai.outputs.allowed }}';
            let reason = '${{ steps.ai.outputs.reason }}' || 'Blocked by DeepSeek';
            reason = reason.replace(/\n/g, ' ').substring(0, 140);
            const state = allowed === 'true' ? 'success' : 'failure';
            const desc = reason || (state === 'success' ? 'Approved by DeepSeek' : 'Blocked by DeepSeek');

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state,
              description: desc,
              context: 'deepseek-merge-check'
            });

            core.setOutput('allowed', allowed);

      - name: Fail workflow if not allowed
        if: steps.set_status.outputs.allowed == 'false'
        run: |
          echo "❌ DeepSeek 审查未通过，合并被阻止。"
          exit 1

      - name: Merge pull request if allowed
        if: steps.set_status.outputs.allowed == 'true'
        uses: actions/github-script@v7
        # ✅ 修正：直接使用 context 和步骤输出，无需传入自定义参数
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headSha = context.payload.pull_request.head.sha;

            // 检查是否可合并
            const pr = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });

            if (pr.data.mergeable === false) {
              await github.rest.repos.createCommitStatus({
                owner,
                repo,
                sha: headSha,
                state: 'failure',
                description: 'PR has merge conflicts, auto-merge impossible.',
                context: 'deepseek-merge-check'
              });
              core.setFailed('❌ PR has conflicts, auto-merge impossible.');
              return;
            }

            try {
              await github.rest.pulls.merge({
                owner,
                repo,
                pull_number: prNumber,
                merge_method: 'merge',
                commit_title: `Auto-merge: ${pr.data.title}`,
                commit_message: `Merged automatically by DeepSeek AI review.`,
              });
              console.log(`✅ PR #${prNumber} merged successfully.`);
            } catch (error) {
              await github.rest.repos.createCommitStatus({
                owner,
                repo,
                sha: headSha,
                state: 'failure',
                description: `Auto-merge failed: ${error.message.slice(0, 140)}`,
                context: 'deepseek-merge-check'
              });
              core.setFailed(`❌ Auto-merge failed: ${error.message}`);
            }
