name: DeepSeek Merge Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  ai-review:
    runs-on: ubuntu-latest
    permissions:
      statuses: write
      pull-requests: write   # 用于合并

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff using SHA (with fallback)
        id: diff
        run: |
          set -e
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"

          git fetch --no-tags --prune origin "$BASE_SHA" || true

          if git fetch --no-tags --prune origin "pull/${PR_NUMBER}/head:pr_head"; then
            DIFF_RANGE="$BASE_SHA..pr_head"
          else
            git fetch --no-tags --prune origin "$HEAD_SHA" || true
            if git rev-parse --verify --quiet "$HEAD_SHA" >/dev/null; then
              DIFF_RANGE="$BASE_SHA..$HEAD_SHA"
            else
              echo "Error: Cannot fetch PR head (pr #${PR_NUMBER}, sha ${HEAD_SHA})"
              exit 1
            fi
          fi

          git diff "$DIFF_RANGE" > pr.diff
          head -n 5000 pr.diff > pr_trimmed.diff
          echo "content<<EOF" >> $GITHUB_OUTPUT
          cat pr_trimmed.diff >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Ask DeepSeek v4-flash
        id: ai
        env:
          API_KEY: ${{ secrets.llm_api_key }}
        run: |
          set -e

          # 构建用户消息内容（标题、描述、diff）到文件
          cat > user_message.txt <<EOF
          PR 标题：${{ github.event.pull_request.title }}
          PR 描述：${{ github.event.pull_request.body }}

          Diff:
          ${{ steps.diff.outputs.content }}
          EOF

          # 使用 jq 构建请求体，--rawfile 读取文件内容
          jq -n \
            --arg model "deepseek-v4-flash" \
            --arg system "你是一个代码审查专家。根据 PR 的 diff 判断是否允许合并，重点检查：逻辑错误、安全漏洞、破坏性变更。只返回 JSON：{\"allowed\": true/false, \"reason\": \"原因\"}" \
            --rawfile user user_message.txt \
            '{
              model: $model,
              messages: [
                {role: "system", content: $system},
                {role: "user", content: $user}
              ],
              temperature: 0.1,
              max_tokens: 256
            }' > request.json

          echo "请求体大小: $(wc -c < request.json) 字节"

          curl -s --max-time 60 -o response_body -w "%{http_code}" \
            https://api.deepseek.com/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $API_KEY" \
            -d @request.json \
            > http_code.txt

          HTTP_CODE=$(cat http_code.txt)
          echo "HTTP状态码: $HTTP_CODE"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "API调用失败，HTTP状态码: $HTTP_CODE"
            echo "响应内容:"
            cat response_body
            echo "allowed=false" >> $GITHUB_OUTPUT
            echo "reason=DeepSeek API 调用失败 (HTTP $HTTP_CODE)" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ ! -s response_body ]; then
            echo "响应体为空"
            echo "allowed=false" >> $GITHUB_OUTPUT
            echo "reason=DeepSeek 返回空响应" >> $GITHUB_OUTPUT
            exit 0
          fi

          if ! jq -e . response_body >/dev/null 2>&1; then
            echo "响应不是有效的JSON，前200字符:"
            head -c 200 response_body
            echo ""
            echo "allowed=false" >> $GITHUB_OUTPUT
            echo "reason=DeepSeek 返回格式错误" >> $GITHUB_OUTPUT
            exit 0
          fi

          CONTENT=$(jq -r '.choices[0].message.content // ""' response_body)
          if [ -z "$CONTENT" ]; then
            echo "未获取到有效内容"
            echo "allowed=false" >> $GITHUB_OUTPUT
            echo "reason=DeepSeek 返回内容为空" >> $GITHUB_OUTPUT
            exit 0
          fi

          ALLOWED=$(echo "$CONTENT" | jq -r '.allowed // false')
          REASON=$(echo "$CONTENT" | jq -r '.reason // "未知原因"')

          echo "allowed=$ALLOWED" >> $GITHUB_OUTPUT
          echo "reason=$REASON" >> $GITHUB_OUTPUT
          echo "AI 审查结论: allowed=$ALLOWED, reason=$REASON"

      - name: Set merge check status
        id: set_status
        uses: actions/github-script@v7
        with:
          script: |
            const allowed = '${{ steps.ai.outputs.allowed }}';
            const reason = '${{ steps.ai.outputs.reason }}' || 'Blocked by DeepSeek';
            const state = allowed === 'true' ? 'success' : 'failure';
            const desc = reason ? reason.substring(0, 140) : (state === 'success' ? 'Approved by DeepSeek' : 'Blocked by DeepSeek');

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state,
              description: desc,
              context: 'deepseek-merge-check'
            });

            core.setOutput('allowed', allowed);

      - name: Fail workflow if not allowed
        if: steps.set_status.outputs.allowed == 'false'
        run: |
          echo "❌ DeepSeek 审查未通过，合并被阻止。"
          exit 1

      - name: Merge pull request if allowed
        if: steps.set_status.outputs.allowed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const pr = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });

            if (pr.data.mergeable === false) {
              core.setFailed('❌ PR has merge conflicts, cannot merge automatically.');
              return;
            }

            await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: prNumber,
              merge_method: 'merge',
              commit_title: `Auto-merge: ${pr.data.title}`,
              commit_message: `Merged automatically by DeepSeek AI review.`,
            });

            console.log(`✅ PR #${prNumber} merged automatically.`);
